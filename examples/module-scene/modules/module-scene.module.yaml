# Почему: манифест связывает объявленный модулем ID сцены с её отдельным ресурсом; без этой записи ссылка из entry.scene не разрешается.
specVersion: "1.0"
module:
  id: "synapse.example.modulescene"
  version: "1.0.0"
  titleKey: "game.example_minimal.title"
requires:
  spec: "1.0"
  engine: ">=4.7.0 <5.0.0"
provides:
  scenes: ["scene.example.module-workshop"]
  sceneEntries:
    - id: "scene.example.module-workshop"
      resource: "res://runtime/scenes/module_scene_example.tscn"
