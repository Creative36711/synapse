name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      SYNAPSE_GODOT_MODE: offscreen
      GODOT_BIN: /tmp/synapse-godot/bin/godot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked npm dependencies offline
        run: ./tools/deps/offline-install.sh
      - name: Install bundled Godot
        run: |
          tools/godot/install.sh
          echo /tmp/synapse-godot/bin >> "$GITHUB_PATH"
      - name: Provision ImageMagick compare
        shell: bash
        run: |
          if command -v compare >/dev/null 2>&1; then
            echo "compare already available: $(command -v compare)"
          else
            set +e
            apt_output="$(sudo apt-get update 2>&1)"
            apt_rc=$?
            if [ "$apt_rc" -eq 0 ]; then
              install_output="$(sudo apt-get install --no-install-recommends -y imagemagick 2>&1)"
              apt_rc=$?
              apt_output="$(printf '%s\n%s' "$apt_output" "$install_output")"
            fi
            set -e
            if [ "$apt_rc" -ne 0 ]; then
              node - "$apt_rc" "$apt_output" <<'NODE'
          const [exitCode, output] = process.argv.slice(2);
          const record = {
            catalogKey: 'errors.runtime.engine.missing',
            code: 'runtime.engine.missing',
            params: {
              actual: { available: false, exit_code: Number(exitCode), output: output || 'install_failed' },
              engine: 'ImageMagick compare',
              expected: { command: 'compare -version', available: true },
              path: 'compare',
            },
          };
          process.stderr.write(`${JSON.stringify(record)}\n`);
          NODE
              exit 1
            fi
          fi
      - name: Preflight ImageMagick compare
        shell: bash
        run: |
          set +e
          compare_output="$(compare -version 2>&1)"
          compare_rc=$?
          set -e
          if [ "$compare_rc" -ne 0 ]; then
            node - "$compare_rc" "$compare_output" <<'NODE'
          const [exitCode, output] = process.argv.slice(2);
          const record = {
            catalogKey: 'errors.runtime.engine.missing',
            code: 'runtime.engine.missing',
            params: {
              actual: { exit_code: Number(exitCode), output: output || 'not_found' },
              engine: 'ImageMagick compare',
              expected: { command: 'compare -version', available: true },
              path: 'compare',
            },
          };
          process.stderr.write(`${JSON.stringify(record)}\n`);
          NODE
            exit 1
          fi
          printf '%s\n' "$compare_output" | sed -n '1p'
      - name: Install pinned GDScript parser
        run: node tools/i18n/setup-parser.mjs
      - run: npm run check:contracts
      - run: npm run test:contracts
      - run: npm run test:validation
      - run: npm run test:modules
      - run: npm run test:i18n
      - name: test:cli — core run, arena, and input
        env:
          SYNAPSE_CLI_TEST_PATTERN: 'run validates|arena GameSpec|public run --input'
        run: npm run test:cli
      - name: test:cli — V-2 world-state invariants
        env:
          SYNAPSE_CLI_TEST_PATTERN: 'arena GameSpec produces a locale-independent state fingerprint|state-motion rules are locale-invariant'
        run: npm run test:cli
      - name: test:cli — dependency and runtime failures
        env:
          SYNAPSE_CLI_TEST_PATTERN: 'missing GameSpec|missing Node|missing Godot|renderer failure|state capture failure'
        run: npm run test:cli
      - name: test:cli — flags and validation
        env:
          SYNAPSE_CLI_TEST_PATTERN: 'validate and resolve|validate treats|run applies|missing and unsupported|unknown option'
        run: npm run test:cli
      - name: test:cli — state capture and state diagnostics
        env:
          SYNAPSE_CLI_TEST_PATTERN: 'run --state'
        run: npm run test:cli
      - name: test:cli — motion and module scenes
        env:
          SYNAPSE_CLI_TEST_PATTERN: 'state-motion|run resolves|module-scene example|unknown semantic scene'
        run: npm run test:cli
      - run: npm run test:runtime
      - run: npm run test:deps
      - run: npm run i18n-check
      - run: npm run i18n-no-literals -- --require-parser
