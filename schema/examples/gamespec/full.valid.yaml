# Полная валидная GameSpec: идентичность, точка входа, модули, локали.
specVersion: "1.0"
game:
  id: "synapse.demo.garden"
  version: "1.2.3"
  titleKey: "game.synapse_demo_garden.title"
  descriptionKey: "game.synapse_demo_garden.description"
entry:
  scene: "scene.garden.title-screen"
modules:
  - id: "synapse.core.platformer"
    version: "^1.2.0"
  - id: "synapse.core.ui"
    version: ">=1.0.0 <2.0.0"
    optional: false
locales:
  default: "en"
  supported: ["en", "ru", "de"]
# Определения сущностей: id плюс неизменяемые свойства. Состояния экземпляра здесь нет.
entities:
  - id: "entity.garden.player"
    properties:
      max_health: 100
      walk_speed: 3.5
      can_dash: false
      nameKey: "game.synapse_demo_garden.entity_player.name"
  - id: "entity.garden.crate"
    properties:
      max_health: 10
      breakable: true
