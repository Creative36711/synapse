# Связь смысловых ID сцен с ресурсами: id входит в provides.scenes, ресурсы существуют.
specVersion: "1.0"
module:
  id: "synapse.core.ui"
  version: "1.0.0"
  titleKey: "module.synapse_core_ui.title"
requires:
  spec: "1.0"
  engine: ">=4.7.0 <5.0.0"
provides:
  scenes: ["scene.main-menu", "scene.state-motion"]
  sceneEntries:
    - id: "scene.main-menu"
      resource: "res://runtime/scenes/main_menu.tscn"
    - id: "scene.state-motion"
      resource: "res://runtime/scenes/state_motion.tscn"
